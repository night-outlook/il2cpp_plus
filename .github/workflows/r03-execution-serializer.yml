name: R03 execution diagnostic serializer contract
on:
  push:
    branches: ['codex/assembly-shadow-r01b-h1']
    paths:
      - 'libil2cpp/vm/AssemblyShadowExecutionSerializer.h'
      - 'libil2cpp/vm/AssemblyShadowDiagnosticWriter.h'
      - 'libil2cpp/vm/AssemblyShadow.cpp'
      - 'tools/r03/diagnostic_stream/execution_serializer_tests.cpp'
      - '.github/workflows/r03-execution-serializer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: clang++
          - os: ubuntu-24.04
            compiler: g++
          - os: macos-15
            compiler: clang++
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify actual production source uses shared execution formatter
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('libil2cpp/vm/AssemblyShadow.cpp').read_text()
          start=p.index('AssemblyShadowError AssemblyShadow::GetExecutionDiagnosticsJson(std::string& json)')
          end=p.index('const Il2CppAssembly* AssemblyShadow::ResolveAssembly',start)
          body=p[start:end]
          for symbol in ('assembly_shadow_execution_diagnostic::Begin(output, heading)',
                         'assembly_shadow_execution_diagnostic::AppendClass(output, row, index != 0)',
                         'assembly_shadow_execution_diagnostic::EndClasses(output)',
                         'assembly_shadow_r02::AppendDiagnostics(output)'):
              assert symbol in body, symbol
          assert 'FormatMetadataOnly(&klass->byval_arg, images)' in body
          assert 'if (index) output <<' not in body
          print('shared execution formatter source integration verified')
          PY
      - name: Strict and sanitized C++17 source-bound host tests
        shell: bash
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r03-execution-serializer"
          src=tools/r03/diagnostic_stream/execution_serializer_tests.cpp
          for profile in strict sanitized; do
            exe="$RUNNER_TEMP/r03-execution-serializer/$profile"
            options=(-std=c++17 -Wall -Wextra -Werror -pedantic -iquote libil2cpp/vm)
            if [[ "$profile" == sanitized ]]; then
              options+=(-g -O1 -fno-omit-frame-pointer -fsanitize=address,undefined)
              export ASAN_OPTIONS="abort_on_error=1:detect_leaks=0"
              export UBSAN_OPTIONS="halt_on_error=1:print_stacktrace=1"
            else
              options+=(-O2)
            fi
            "$CXX" "${options[@]}" "$src" -o "$exe"
            "$exe"
          done
