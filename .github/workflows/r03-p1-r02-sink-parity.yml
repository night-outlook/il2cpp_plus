name: R03 P1 R02 diagnostic fixed sink byte parity
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths:
      - libil2cpp/vm/AssemblyShadowR02Diagnostics.h
      - libil2cpp/vm/AssemblyShadowFrozenR02Capture.h
      - libil2cpp/vm/AssemblyShadowDiagnosticWriter.h
      - libil2cpp/vm/AssemblyShadowObservationCounters.h
      - libil2cpp/vm/AssemblyShadowObservationMemo.h
      - tools/r03/diagnostic_stream/r02_sink_parity_tests.cpp
      - .github/workflows/r03-p1-r02-sink-parity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r02-parity:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            cxx: clang++
          - os: ubuntu-24.04
            cxx: clang++
          - os: ubuntu-24.04
            cxx: g++
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            libil2cpp/vm/AssemblyShadowR02Diagnostics.h
            libil2cpp/vm/AssemblyShadowFrozenR02Capture.h
            libil2cpp/vm/AssemblyShadowFrozenExecutionCapture.h
            libil2cpp/vm/AssemblyShadowExecutionSerializer.h
            libil2cpp/vm/AssemblyShadowDiagnosticWriter.h
            libil2cpp/vm/AssemblyShadowObservationCounters.h
            libil2cpp/vm/AssemblyShadowObservationMemo.h
            libil2cpp/vm/AssemblyShadowDiagnosticsProfile.h
            tools/r03/diagnostic_stream/r02_sink_parity_tests.cpp
          sparse-checkout-cone-mode: false
      - name: Strict C++17 and ASan/UBSan parity, diagnostics levels 0/1/2
        shell: bash
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r02-parity"
          for profile in strict sanitized; do
            for level in 0 1 2; do
              exe="$RUNNER_TEMP/r02-parity/$profile-$level"
              args=(-std=c++17 -Wall -Wextra -Werror -pedantic -iquote libil2cpp/vm "-DHYBRIDCLR_ASSEMBLY_SHADOW_DIAGNOSTICS_LEVEL=$level")
              if [[ "$profile" == sanitized ]]; then
                args+=(-g -O1 -fno-omit-frame-pointer -fsanitize=address,undefined)
                if [[ "$RUNNER_OS" == "macOS" ]]; then
                  export ASAN_OPTIONS=detect_leaks=0:abort_on_error=1
                else
                  export ASAN_OPTIONS=detect_leaks=1:abort_on_error=1
                fi
                export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
              else
                args+=(-O2)
              fi
              "$CXX" "${args[@]}" tools/r03/diagnostic_stream/r02_sink_parity_tests.cpp -o "$exe"
              "$exe"
            done
          done
