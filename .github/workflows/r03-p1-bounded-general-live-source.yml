name: R03 P1 inactive live general source contract
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths:
      - 'libil2cpp/vm/AssemblyShadowBoundedGeneralLive.h'
      - 'libil2cpp/vm/AssemblyShadowBoundedGeneralLiveSource.inl'
      - 'libil2cpp/vm/AssemblyShadow.h'
      - 'libil2cpp/vm/AssemblyShadow.cpp'
      - 'libil2cpp/vm/AssemblyShadowMetadataLifetime.h'
      - 'libil2cpp/vm/AssemblyShadowBoundedGeneralComposer.h'
      - 'libil2cpp/vm/AssemblyShadowFrozenGeneralCapture.h'
      - 'tools/r03/diagnostic_stream/bounded_general_live_fixture.cpp'
      - 'tools/r03/diagnostic_stream/run_bounded_general_live.py'
      - '.github/workflows/r03-p1-bounded-general-live-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-inactive-live-source:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            cxx: clang++
          - os: ubuntu-24.04
            cxx: clang++
          - os: ubuntu-24.04
            cxx: g++
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            libil2cpp/vm/AssemblyShadow.cpp
            libil2cpp/vm/AssemblyShadow.h
            libil2cpp/vm/AssemblyShadowBoundedGeneralLive.h
            libil2cpp/vm/AssemblyShadowBoundedGeneralLiveSource.inl
            libil2cpp/vm/AssemblyShadowMetadataLifetime.h
            libil2cpp/vm/AssemblyShadowBoundedGeneralComposer.h
            libil2cpp/vm/AssemblyShadowFrozenGeneralCapture.h
            libil2cpp/vm/AssemblyShadowBoundedTransactionInventory.h
            libil2cpp/vm/AssemblyShadowBoundedTransactionStatus.h
            libil2cpp/vm/AssemblyShadowBoundedFirstUseCapture.h
            libil2cpp/vm/AssemblyShadowBoundedPhysicalAssemblies.h
            libil2cpp/vm/AssemblyShadowBoundedOrdinaryClasses.h
            libil2cpp/vm/AssemblyShadowDiagnostics.cpp
            libil2cpp/vm/AssemblyShadowDiagnostics.h
            libil2cpp/vm/AssemblyShadowDiagnosticWriter.h
            libil2cpp/vm/AssemblyShadowTypes.h
            tools/r03/diagnostic_stream/bounded_general_live_fixture.cpp
            tools/r03/diagnostic_stream/allocation_probe.cpp
            tools/r03/diagnostic_stream/run_bounded_general_live.py
          sparse-checkout-cone-mode: false
      - name: Compile exact inactive VM method and run source-fence negative tests
        shell: bash
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/r03-live-general-${{ github.run_id }}-${{ github.run_attempt }}"
          python3 -B tools/r03/diagnostic_stream/run_bounded_general_live.py \
            --native "$GITHUB_WORKSPACE" --output "$dir"
          python3 -B - "$dir/RESULT.json" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_bytes())
          assert r['result']=='PassedWithinInactiveSourceHostScope'
          assert r['sourcePreserved'] and r['compiledExactProductionSource']
          assert r['compiledActualBoundedSourcesAndSerializer']
          assert list(r['caseGroups'])==['strict','sanitized']
          assert all(len(p['caseGroups'])==13 for p in r['caseGroups'].values())
          assert len(r['commands'])==4 and all(c['exit']==0 for c in r['commands'])
          for field in ('realEngineMetadataGate','coherentVmEpochProven',
             'nativeClassPointerOriginProven','realShutdownDeadlockFreedomProven',
             'fullRuntimeAllocationGcRssProven','originalLiveGettersReplaced',
             'officialUnitySdkCompiled','playerExecuted','runtimeAcceptance'):
              assert r[field] is False,field
          print("Exact inactive VM source body: strict and sanitizer host PASS")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r03-live-general-${{ matrix.os }}-${{ matrix.cxx }}-${{ github.sha }}
          path: ${{ runner.temp }}/r03-live-general-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
