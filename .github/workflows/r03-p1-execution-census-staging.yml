name: R03 P1 execution identity-only census staging
on:
  push:
    branches: ['codex/p1-execution-scalars-20261018']
    paths:
      - 'libil2cpp/vm/AssemblyShadow.cpp'
      - 'libil2cpp/vm/AssemblyShadow.h'
      - 'libil2cpp/vm/AssemblyShadowBoundedExecutionCensus.h'
      - 'libil2cpp/vm/AssemblyShadowBoundedExecutionCensusSource.inl'
      - 'tools/r03/diagnostic_stream/bounded_execution_census_fixture.cpp'
      - 'tools/r03/diagnostic_stream/run_bounded_execution_census.py'
      - '.github/workflows/r03-p1-execution-census-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-execution-identity-census:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            cxx: clang++
          - os: ubuntu-24.04
            cxx: clang++
          - os: ubuntu-24.04
            cxx: g++
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            libil2cpp/vm/AssemblyShadow.cpp
            libil2cpp/vm/AssemblyShadow.h
            libil2cpp/vm/AssemblyShadowBoundedExecutionCensus.h
            libil2cpp/vm/AssemblyShadowBoundedExecutionCensusSource.inl
            libil2cpp/vm/AssemblyShadowMetadataLifetime.h
            tools/r03/diagnostic_stream/bounded_execution_census_fixture.cpp
            tools/r03/diagnostic_stream/allocation_probe.cpp
            tools/r03/diagnostic_stream/run_bounded_execution_census.py
          sparse-checkout-cone-mode: false
      - name: Compile exact native census, execute owned table tests
        shell: bash
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/r03-p1-census-${{ github.run_id }}-${{ github.run_attempt }}"
          python3 -B tools/r03/diagnostic_stream/run_bounded_execution_census.py \
            --native "$GITHUB_WORKSPACE" --output "$out"
          python3 -B - "$out/RESULT.json" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_bytes())
          assert r['result']=='PassedWithinInactiveHostScope'
          assert r['sourcePreserved'] and r['actualProductionMethodAndCaptureCompiled']
          assert set(r['profiles'])=={'strict','sanitized'}
          assert all(len(p['groups'])==12 for p in r['profiles'].values())
          assert len(r['commands'])==4 and all(c['exit']==0 for c in r['commands'])
          assert r['maximumObservedClasses']==1024 and r['observedRegistryTableSlots']==2048
          assert not r['sourceClassPointerDereferenced']
          assert not r['sourceClassPointerOrHashExported']
          for k in ('classOriginAndLifetimeProven','allVmEpochProven',
                    'completeExecutionClassRowsOrTypeKeys','officialUnitySdkCompiler',
                    'realPlayerOrRuntime','runtimeAcceptance'):
              assert r[k] is False,k
          print('R03 P1 source-bound class observation identities HOST ONLY PASS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p1-execution-census-${{ matrix.os }}-${{ matrix.cxx }}-${{ github.sha }}
          path: ${{ runner.temp }}/r03-p1-census-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
