name: R03 P1 classless execution composition staging
on:
  push:
    branches: ['codex/p1-execution-scalars-20261018']
    paths:
      - 'libil2cpp/vm/AssemblyShadowBoundedExecutionComposite.h'
      - 'libil2cpp/vm/AssemblyShadowBoundedExecutionHeader.h'
      - 'libil2cpp/vm/AssemblyShadowBoundedR02Metrics.h'
      - 'libil2cpp/vm/AssemblyShadowExecutionSerializer.h'
      - 'libil2cpp/vm/AssemblyShadowR02Diagnostics.h'
      - 'libil2cpp/vm/AssemblyShadowObservationCounters.h'
      - 'tools/r03/diagnostic_stream/bounded_execution_composite_fixture.cpp'
      - 'tools/r03/diagnostic_stream/run_bounded_execution_composite.py'
      - '.github/workflows/r03-p1-classless-execution-composite-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  classless-execution-parity:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            cxx: clang++
          - os: ubuntu-24.04
            cxx: clang++
          - os: ubuntu-24.04
            cxx: g++
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            libil2cpp/vm/AssemblyShadowBoundedExecutionComposite.h
            libil2cpp/vm/AssemblyShadowBoundedExecutionHeader.h
            libil2cpp/vm/AssemblyShadowBoundedR02Metrics.h
            libil2cpp/vm/AssemblyShadowExecutionSerializer.h
            libil2cpp/vm/AssemblyShadowR02Diagnostics.h
            libil2cpp/vm/AssemblyShadowObservationCounters.h
            libil2cpp/vm/AssemblyShadowObservationMemo.h
            libil2cpp/vm/AssemblyShadowDiagnosticsProfile.h
            libil2cpp/vm/AssemblyShadowDiagnostics.h
            libil2cpp/vm/AssemblyShadowDiagnostics.cpp
            libil2cpp/vm/AssemblyShadowDiagnosticWriter.h
            libil2cpp/vm/AssemblyShadowTypes.h
            tools/r03/diagnostic_stream/bounded_execution_composite_fixture.cpp
            tools/r03/diagnostic_stream/allocation_probe.cpp
            tools/r03/diagnostic_stream/run_bounded_execution_composite.py
          sparse-checkout-cone-mode: false
      - name: Exact bounded classless execution JSON parity with real source counters
        shell: bash
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/r03-classless-execution-${{ github.run_id }}-${{ github.run_attempt }}"
          python3 -B tools/r03/diagnostic_stream/run_bounded_execution_composite.py \
            --native "$GITHUB_WORKSPACE" --output "$output"
          python3 -B - "$output/RESULT.json" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_bytes())
          assert r['result']=='PassedWithinInactiveHostScope'
          assert r['sourcePreserved']
          assert r['sourceContract']['legacyR02FieldOrderAuthenticated']
          assert r['sourceContract']['realObservationCountersNotMocked']
          assert r['sourceContract']['metricFields']==22
          assert len(r['commands'])==4 and all(x['exit']==0 for x in r['commands'])
          assert set(r['profiles'])=={'strict','sanitized'}
          assert all(len(x['groups'])==12 for x in r['profiles'].values())
          for field in ('fullExecutionJsonProven','realClassRowsOrTypeKeysCovered',
                         'coherentVmEpochProven','sourceGcRssOrTeardownSafetyProven',
                         'originalExecutionGetterReplaced','officialUnitySdkCompiled',
                         'unityEditorOrPlayerRun','runtimeAcceptance'):
              assert r[field] is False,field
          print('R03 P1 classless execution JSON host parity ONLY PASS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p1-classless-execution-${{ matrix.os }}-${{ matrix.cxx }}-${{ github.sha }}
          path: ${{ runner.temp }}/r03-classless-execution-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
