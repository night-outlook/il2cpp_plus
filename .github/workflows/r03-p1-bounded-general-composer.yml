name: R03 P1 owned-source general V1 composition host
on:
  push:
    branches: ['codex/assembly-shadow-r01b-h1']
    paths:
      - 'libil2cpp/vm/AssemblyShadowBoundedGeneralComposer.h'
      - 'libil2cpp/vm/AssemblyShadowFrozenGeneralCapture.h'
      - 'libil2cpp/vm/AssemblyShadowBoundedTransactionInventory.h'
      - 'libil2cpp/vm/AssemblyShadowBoundedTransactionStatus.h'
      - 'libil2cpp/vm/AssemblyShadowBoundedFirstUseCapture.h'
      - 'libil2cpp/vm/AssemblyShadowBoundedPhysicalAssemblies.h'
      - 'libil2cpp/vm/AssemblyShadowBoundedOrdinaryClasses.h'
      - 'libil2cpp/vm/AssemblyShadowDiagnostics.cpp'
      - 'libil2cpp/vm/AssemblyShadowDiagnostics.h'
      - 'libil2cpp/vm/AssemblyShadowDiagnosticWriter.h'
      - 'tools/r03/diagnostic_stream/bounded_general_composer_fixture.cpp'
      - 'tools/r03/diagnostic_stream/run_bounded_general_composer.py'
      - '.github/workflows/r03-p1-bounded-general-composer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-owned-general:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            cxx: clang++
          - os: ubuntu-24.04
            cxx: clang++
          - os: ubuntu-24.04
            cxx: g++
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            libil2cpp/vm/AssemblyShadowBoundedGeneralComposer.h
            libil2cpp/vm/AssemblyShadowFrozenGeneralCapture.h
            libil2cpp/vm/AssemblyShadowBoundedTransactionInventory.h
            libil2cpp/vm/AssemblyShadowBoundedTransactionStatus.h
            libil2cpp/vm/AssemblyShadowBoundedFirstUseCapture.h
            libil2cpp/vm/AssemblyShadowBoundedPhysicalAssemblies.h
            libil2cpp/vm/AssemblyShadowBoundedOrdinaryClasses.h
            libil2cpp/vm/AssemblyShadowDiagnosticWriter.h
            libil2cpp/vm/AssemblyShadowDiagnostics.h
            libil2cpp/vm/AssemblyShadowDiagnostics.cpp
            libil2cpp/vm/AssemblyShadowTypes.h
            tools/r03/diagnostic_stream/bounded_general_composer_fixture.cpp
            tools/r03/diagnostic_stream/allocation_probe.cpp
            tools/r03/diagnostic_stream/run_bounded_general_composer.py
          sparse-checkout-cone-mode: false
      - name: Actual bounded capture headers, old V1 serializer and negative source tests
        shell: bash
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/r03-p1-owned-general-${{ github.run_id }}-${{ github.run_attempt }}"
          python3 -B tools/r03/diagnostic_stream/run_bounded_general_composer.py \
            --native "$GITHUB_WORKSPACE" --output "$dir"
          python3 -B - "$dir/RESULT.json" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text())
          assert r['result']=='PassedWithinOwnedHostScope'
          assert r['sourcePreserved'] and r['actualProductionHeadersCompiled']
          assert r['legacySerializerSameSourceCompiled']
          assert len(r['profiles'])==2 and set(r['profiles'])=={'strict','sanitized'}
          assert all(len(p['cases'])==11 and p['allocationsAfterPrewarm']==0
                     for p in r['profiles'].values())
          assert len(r['commands'])==4 and all(c['exit']==0 for c in r['commands'])
          assert not r['allVmEpochProven'] and not r['realClassPointerProven']
          assert not r['originalLiveGettersReplaced']
          assert not r['vmAllocationGcRssProven']
          assert not r['officialUnitySdkCompiled']
          assert not r['realPlayerRun'] and not r['runtimeAcceptance']
          print("R03 P1 owned general V1 byte composition HOST scope only PASS")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p1-owned-general-${{ matrix.os }}-${{ matrix.cxx }}-${{ github.sha }}
          path: ${{ runner.temp }}/r03-p1-owned-general-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
