name: R03 B2 actual legacy/frozen execution serializer byte parity (NOT Unity)
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths:
      - .github/workflows/r03-native-b2-execution-v1-serializer-parity-host.yml
      - NativeHostTests/AssemblyShadowExecutionV1SerializerParityHost.cpp
      - libil2cpp/vm/AssemblyShadowExecutionSerializer.h
      - libil2cpp/vm/AssemblyShadowFrozenExecutionRecord.h
      - libil2cpp/vm/AssemblyShadowR02Diagnostics.h
      - libil2cpp/vm/AssemblyShadowFrozenR02Serializer.h
      - libil2cpp/vm/AssemblyShadowR02Snapshot.h
      - libil2cpp/vm/AssemblyShadowObservationCounters.h
      - libil2cpp/vm/AssemblyShadowObservationMemo.h
      - libil2cpp/vm/AssemblyShadowDiagnosticWriter.h
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-v1-serializer-parity:
    name: Actual V1/frozen JSON ${{ matrix.os }} ${{ matrix.std }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        std: [c++11, c++17]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            NativeHostTests/AssemblyShadowExecutionV1SerializerParityHost.cpp
            libil2cpp/vm
      - name: Compare actual original V1 ostream and frozen record over identical rows
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          clang++ --version
          shasum -a 256 \
            libil2cpp/vm/AssemblyShadowExecutionSerializer.h \
            libil2cpp/vm/AssemblyShadowFrozenExecutionRecord.h \
            libil2cpp/vm/AssemblyShadowR02Diagnostics.h \
            libil2cpp/vm/AssemblyShadowFrozenR02Serializer.h \
            libil2cpp/vm/AssemblyShadowR02Snapshot.h \
            libil2cpp/vm/AssemblyShadowObservationCounters.h \
            libil2cpp/vm/AssemblyShadowObservationMemo.h
          mkdir -p "$RUNNER_TEMP/r03-v1-formatter"
          for flavor in release debug; do
            for profile in strict sanitized; do
              flags=(-std=${{ matrix.std }} -g -O1 -Wall -Wextra -Werror -pedantic -pthread)
              if [ "$flavor" = debug ]; then
                flags+=(-DIL2CPP_DEBUG=1)
              fi
              if [ "$profile" = sanitized ]; then
                flags+=(-fsanitize=address,undefined -fno-omit-frame-pointer)
              fi
              exe="$RUNNER_TEMP/r03-v1-formatter/$flavor-$profile"
              clang++ "${flags[@]}" -Ilibil2cpp \
                NativeHostTests/AssemblyShadowExecutionV1SerializerParityHost.cpp \
                -o "$exe"
              ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 \
              UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
                "$exe" > "$exe.json"
              cat "$exe.json"
              python3 -B - "$exe.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1],encoding="utf8"))
          assert j["kind"]=="R03B2OriginalV1ExecutionSerializerParityHost"
          assert j["result"]=="PassedActualLegacyAndFrozenSerializerBytes"
          assert j["cases"]==10 and j["rows"]==6
          assert j["assertions"]>=88
          assert j["guardedAllocations"]==0
          assert j["actualLegacyR02Formatter"] is True
          assert j["actualFrozenR02Formatter"] is True
          assert j["exactByteEqualityWithImmutableRows"] is True
          for key in ("actualUnityClassMetadata","wholeVmEpochProven",
                      "completeField15InPlayer","terminalSafeField15",
                      "nativeV2TransportImplemented","runtimeAcceptance"):
              assert j[key] is False
          PY
            done
          done
