name: R03 B2 reference folded assembly C++11/17 host (NOT Unity)
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths:
      - .github/workflows/r03-native-b2-folded-assembly-host.yml
      - libil2cpp/vm/AssemblyShadowOwnedDefinitionTypeKey.h
      - NativeHostTests/AssemblyShadowFoldedNameMock.h
      - NativeHostTests/AssemblyShadowOwnedFoldedDefinitionHost.cpp
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure-folded-assembly:
    runs-on: ${{ matrix.os }}
    name: Reference UTF16 fold ${{ matrix.os }} ${{ matrix.std }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        std: [c++11, c++17]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            libil2cpp/vm
            NativeHostTests
      - name: Strict and sanitized host, no protected allocations
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          SRC=NativeHostTests/AssemblyShadowOwnedFoldedDefinitionHost.cpp
          mkdir -p "$RUNNER_TEMP/r03-b2-folded"
          for buildFlavor in release debug; do
            for profile in strict sanitized; do
              flags=(-std=${{ matrix.std }} -O1 -g -Wall -Wextra -Werror -pedantic -pthread)
              if [ "$profile" = sanitized ]; then
                flags+=(-fsanitize=address,undefined -fno-omit-frame-pointer)
              fi
              if [ "$buildFlavor" = debug ]; then
                flags+=(-DIL2CPP_DEBUG=1)
              fi
              exe="$RUNNER_TEMP/r03-b2-folded/$buildFlavor-$profile"
              clang++ "${flags[@]}" -Ilibil2cpp "$SRC" -o "$exe"
              ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 \
              UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
                "$exe" > "$exe.json"
              cat "$exe.json"
              python3 -B - "$exe.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1],encoding='utf8'))
          assert j['kind']=='R03B2CanonicalFoldedAssemblyHost'
          assert j['result']=='PassedOwnedFoldedBytesOnly'
          assert j['cases']==14 and j['assertions']>=45
          assert j['guardedAllocations']==0
          for key in ('actualVmUnicodeTable','fullLegacyFieldParity',
                      'realUnity','nativeV2TransportImplemented','runtimeAcceptance'):
              assert j[key] is False
          PY
            done
          done
