name: R03 P1 bounded ordinary class source and legacy V1 host parity
on:
  push:
    branches: [codex/assembly-shadow-r01b-h1]
    paths:
      - 'libil2cpp/vm/AssemblyShadowVisibility.cpp'
      - 'libil2cpp/vm/AssemblyShadowVisibility.h'
      - 'libil2cpp/vm/AssemblyShadowBoundedOrdinaryClasses.h'
      - 'libil2cpp/vm/AssemblyShadowMetadataLifetime.h'
      - 'tools/r03/diagnostic_stream/bounded_ordinary_classes_fixture.cpp'
      - 'tools/r03/diagnostic_stream/run_bounded_ordinary_classes.py'
      - '.github/workflows/r03-p1-bounded-ordinary-classes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-bound-classes:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            compiler: clang++
          - os: ubuntu-24.04
            compiler: clang++
          - os: ubuntu-24.04
            compiler: g++
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            libil2cpp/vm/AssemblyShadowVisibility.cpp
            libil2cpp/vm/AssemblyShadowVisibility.h
            libil2cpp/vm/AssemblyShadowBoundedOrdinaryClasses.h
            libil2cpp/vm/AssemblyShadowMetadataLifetime.h
            libil2cpp/vm/AssemblyShadowFrozenGeneralCapture.h
            libil2cpp/vm/AssemblyShadowDiagnostics.cpp
            libil2cpp/vm/AssemblyShadowDiagnostics.h
            libil2cpp/vm/AssemblyShadowTypes.h
            libil2cpp/vm/AssemblyShadowDiagnosticWriter.h
            tools/r03/diagnostic_stream/bounded_ordinary_classes_fixture.cpp
            tools/r03/diagnostic_stream/run_bounded_ordinary_classes.py
            tools/r03/diagnostic_stream/fixtures/LegacyAssemblyShadowDiagnostics.cpp
            tools/r03/diagnostic_stream/fixtures/AssemblyShadowDiagnostics.h
            tools/r03/diagnostic_stream/allocation_probe.cpp
          sparse-checkout-cone-mode: false
      - name: Current native class callback, fixed source, original V1 byte parity
        shell: bash
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/p1-ordinary-${{ github.run_id }}-${{ github.run_attempt }}"
          python3 -B tools/r03/diagnostic_stream/run_bounded_ordinary_classes.py \
            --native "$GITHUB_WORKSPACE" --output "$output"
          python3 -B - "$output/RESULT.json" <<'PY'
          import json,sys
          from pathlib import Path
          data=json.loads(Path(sys.argv[1]).read_text())
          assert data["result"]=="PassedWithinHostScope"
          assert data["sourcePreserved"] and data["actualCallbackAndMethodBodiesCompiled"]
          assert data["profilesCompleted"]==["strict","sanitized"]
          assert len(data["commands"])==6 and all(x["exit"]==0 for x in data["commands"])
          assert not data["realMetadataShutdownQuiescenceProven"]
          assert not data["realClassEnumeratorAllocationBoundProven"]
          assert not data["runtimeAcceptance"] and not data["actualUnityPlayerRun"]
          print("P1 bounded class source/metadata lock/mock parity verified")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p1-ordinary-${{ matrix.os }}-${{ matrix.compiler }}-${{ github.sha }}
          path: ${{ runner.temp }}/p1-ordinary-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
