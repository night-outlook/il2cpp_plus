name: R03 P1 actual bounded transaction inventory host source
on:
  push:
    branches: ['codex/assembly-shadow-r01b-h1']
    paths:
      - 'libil2cpp/vm/AssemblyShadow.cpp'
      - 'libil2cpp/vm/AssemblyShadow.h'
      - 'libil2cpp/vm/AssemblyShadowBoundedTransactionInventory.h'
      - 'libil2cpp/vm/AssemblyShadowBoundedTransactionStatus.h'
      - 'libil2cpp/vm/AssemblyShadowFrozenGeneralCapture.h'
      - 'tools/r03/diagnostic_stream/bounded_transaction_inventory_fixture.cpp'
      - 'tools/r03/diagnostic_stream/run_bounded_transaction_inventory.py'
      - '.github/workflows/r03-p1-transaction-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-product-method-host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            cxx: clang++
          - os: ubuntu-24.04
            cxx: clang++
          - os: ubuntu-24.04
            cxx: g++
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            libil2cpp/vm/AssemblyShadow.cpp
            libil2cpp/vm/AssemblyShadow.h
            libil2cpp/vm/AssemblyShadowTypes.h
            libil2cpp/vm/AssemblyShadowBoundedTransactionInventory.h
            libil2cpp/vm/AssemblyShadowBoundedTransactionStatus.h
            libil2cpp/vm/AssemblyShadowFrozenGeneralCapture.h
            libil2cpp/vm/AssemblyShadowDiagnostics.cpp
            libil2cpp/vm/AssemblyShadowDiagnostics.h
            libil2cpp/vm/AssemblyShadowDiagnosticWriter.h
            tools/r03/diagnostic_stream/bounded_transaction_inventory_fixture.cpp
            tools/r03/diagnostic_stream/run_bounded_transaction_inventory.py
            tools/r03/diagnostic_stream/allocation_probe.cpp
          sparse-checkout-cone-mode: false
      - name: Exact production method, fixture and negative cases
        shell: bash
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/r03-p1-inventory-${{ github.run_id }}-${{ github.run_attempt }}"
          python3 -B tools/r03/diagnostic_stream/run_bounded_transaction_inventory.py \
            --native "$GITHUB_WORKSPACE" --output "$output"
          python3 -B - "$output/RESULT.json" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text())
          assert r['result']=='PassedWithinHostScope'
          assert r['completedProfiles']==['strict','sanitized']
          assert len(r['commands'])==4 and all(c['exit']==0 for c in r['commands'])
          assert r['actualProductionMethodBodyCompiled'] and r['sourcePreserved']
          assert not r['globalVmEpochProven'] and not r['actualUnityPlayerRun'] and not r['runtimeAcceptance']
          print('P1 exact production native inventory method: scoped host contracts PASS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p1-inventory-${{ matrix.os }}-${{ matrix.cxx }}-${{ github.sha }}
          path: ${{ runner.temp }}/r03-p1-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
