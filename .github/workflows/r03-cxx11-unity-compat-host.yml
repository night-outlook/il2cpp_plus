name: R03 Unity 2022 C++11 source-host compatibility
on:
  push:
    branches: ['codex/assembly-shadow-r01b-h1']
    paths:
      - 'libil2cpp/vm/AssemblyShadowDiagnosticWriter.h'
      - 'libil2cpp/vm/AssemblyShadowBoundedGeneralComposer.h'
      - 'libil2cpp/vm/AssemblyShadowFrozenExecutionRecord.h'
      - 'libil2cpp/vm/AssemblyShadowExecutionRegistrationWitness.h'
      - 'libil2cpp/vm/AssemblyShadowOwnedPhysicalNames.h'
      - 'libil2cpp/vm/AssemblyShadowBoundedGeneralLiveSource.inl'
      - 'libil2cpp/vm/AssemblyShadowBoundedExecutionEmptyLiveSource.inl'
      - 'tools/r03/diagnostic_stream/cxx11_unity_compat_fixture.cpp'
      - 'tools/r03/diagnostic_stream/bounded_general_live_fixture.cpp'
      - 'tools/r03/diagnostic_stream/owned_physical_names_fixture.cpp'
      - 'tools/r03/diagnostic_stream/empty_live_fixture/fixture.cpp'
      - '.github/workflows/r03-cxx11-unity-compat-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cxx11-compat:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, cxx: clang++}
          - {os: ubuntu-24.04, cxx: g++}
          - {os: macos-15, cxx: clang++}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            libil2cpp/vm/AssemblyShadow*
            tools/r03/diagnostic_stream/cxx11_unity_compat_fixture.cpp
            tools/r03/diagnostic_stream/bounded_general_composer_fixture.cpp
            tools/r03/diagnostic_stream/bounded_general_live_fixture.cpp
            tools/r03/diagnostic_stream/owned_physical_names_fixture.cpp
            tools/r03/diagnostic_stream/empty_live_fixture
      - name: Actual production C++11 headers and inactive live-source mocks
        shell: bash
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          set -euo pipefail
          "$CXX" --version
          # Standalone host mocks supply only the generated Unity config include.
          # Actual Unity SDK config/ABI must still be verified by Local.
          printf '#pragma once\n' > "$RUNNER_TEMP/il2cpp-config.h"
          for std in c++11 c++17; do
            for profile in 0 1; do
              for source in \
                tools/r03/diagnostic_stream/cxx11_unity_compat_fixture.cpp \
                tools/r03/diagnostic_stream/bounded_general_live_fixture.cpp; do
                echo "SYNTACTIC_HOST_SOURCE standard=$std feature=$profile source=$source"
                "$CXX" -std="$std" -fsyntax-only -Wall -Wextra -Werror -pedantic -pthread \
                  -DHYBRIDCLR_ENABLE_ASSEMBLY_SHADOW="$profile" \
                  -Wno-unused-const-variable \
                  -I"$RUNNER_TEMP" -Ilibil2cpp/vm -Itools/r03/diagnostic_stream/empty_live_fixture "$source"
              done
              # Historical composer host fixture itself uses std::make_unique
              # (C++14), so compile that fixture only under its real C++17
              # fixture contract; the production composer header is compiled
              # separately above under both C++11 and C++17.
              if [ "$std" = c++17 ]; then
                "$CXX" -std=c++17 -fsyntax-only -Wall -Wextra -Werror -pedantic -pthread \
                  -DHYBRIDCLR_ENABLE_ASSEMBLY_SHADOW="$profile" \
                  -I"$RUNNER_TEMP" -Ilibil2cpp/vm \
                  tools/r03/diagnostic_stream/bounded_general_composer_fixture.cpp
                "$CXX" -std=c++17 -fsyntax-only -Wall -Wextra -Werror -pedantic -pthread \
                  -DHYBRIDCLR_ENABLE_ASSEMBLY_SHADOW="$profile" \
                  -I"$RUNNER_TEMP" -Ilibil2cpp/vm \
                  tools/r03/diagnostic_stream/owned_physical_names_fixture.cpp
                # The unchanged empty-live mock substitutes VM types and is
                # compiled in its original dedicated C++17 workflow, not with
                # these actual production headers from a second search root.
              fi
            done
          done
          git diff --check
          git diff --exit-code
      - name: Explicit evidence boundary
        shell: bash
        run: |
          echo 'Source/host C++11/C++17 syntax only, actual production headers/mock consumers.'
          echo 'NOT real Unity C++ compilation, IL2CPP linking, Editor build, or Player.'
          echo 'R03Accepted=false, ReadyForHumanReviewGate=false.'
