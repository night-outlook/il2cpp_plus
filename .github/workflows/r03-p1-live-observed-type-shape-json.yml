name: R03 P1 genuine VM observed type-shape JSON source
on:
  push:
    branches: ['codex/assembly-shadow-r01b-h1']
    paths:
      - 'libil2cpp/vm/AssemblyShadow.cpp'
      - 'libil2cpp/vm/AssemblyShadow.h'
      - 'libil2cpp/vm/AssemblyShadowObservedTypeShapeJsonLiveSource.inl'
      - 'tools/r03/diagnostic_stream/run_observed_type_shape_json_live.py'
      - 'tools/r03/diagnostic_stream/observed_type_shape_json_live_fixture.cpp'
      - '.github/workflows/r03-p1-live-observed-type-shape-json.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-vm-owned-shape-json-source:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            cxx: clang++
          - os: ubuntu-24.04
            cxx: clang++
          - os: ubuntu-24.04
            cxx: g++
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: native
      - name: Compile genuine VM shape JSON with strict and sanitized host
        shell: bash
        run: |
          set -euo pipefail
          python3 -B "$GITHUB_WORKSPACE/native/tools/r03/diagnostic_stream/run_observed_type_shape_json_live.py" \
            --native "$GITHUB_WORKSPACE/native" \
            --output "$RUNNER_TEMP/p1-vm-shape-json-${{ github.run_id }}-${{ github.run_attempt }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p1-vm-shape-json-${{ matrix.os }}-${{ matrix.cxx }}-${{ github.sha }}
          path: ${{ runner.temp }}/p1-vm-shape-json-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
