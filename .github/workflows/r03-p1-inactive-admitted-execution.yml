name: R03 P1 inactive metadata-admitted execution diagnostics source
on:
  push:
    branches: ['codex/assembly-shadow-r01b-h1']
    paths:
      - 'libil2cpp/vm/AssemblyShadow.cpp'
      - 'libil2cpp/vm/AssemblyShadow.h'
      - 'libil2cpp/vm/AssemblyShadowAdmittedExecutionDiagnosticsSource.inl'
      - 'libil2cpp/vm/AssemblyShadowMetadataLifetime.h'
      - 'tools/r03/diagnostic_stream/run_admitted_execution_diagnostics.py'
      - 'tools/r03/diagnostic_stream/admitted_execution_diagnostics_fixture.cpp'
      - 'tools/r03/diagnostic_stream/run_owned_physical_names.py'
      - 'tools/r03/diagnostic_stream/run_physical_membership.py'
      - 'tools/r03/diagnostic_stream/run_opaque_execution_inventory.py'
      - '.github/workflows/r03-p1-inactive-admitted-execution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inactive-admitted-source:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            cxx: clang++
          - os: ubuntu-24.04
            cxx: clang++
          - os: ubuntu-24.04
            cxx: g++
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: native
      - name: Compile actual inactive wrapper and lifetime gate in two profiles
        shell: bash
        run: |
          set -euo pipefail
          python3 -B "$GITHUB_WORKSPACE/native/tools/r03/diagnostic_stream/run_admitted_execution_diagnostics.py" \
            --native "$GITHUB_WORKSPACE/native" \
            --output "$RUNNER_TEMP/p1-admitted-exec-${{ github.run_id }}-${{ github.run_attempt }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p1-admitted-exec-${{ matrix.os }}-${{ matrix.cxx }}-${{ github.sha }}
          path: ${{ runner.temp }}/p1-admitted-exec-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
