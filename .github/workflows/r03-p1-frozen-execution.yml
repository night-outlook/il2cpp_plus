name: R03 P1 owned execution record and R02 snapshot
on:
  push:
    branches: ['codex/assembly-shadow-r01b-h1']
    paths:
      - 'libil2cpp/vm/AssemblyShadow*.h'
      - 'tools/r03/diagnostic_stream/**'
      - '.github/workflows/r03-p1-frozen-execution.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owned-execution:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            cxx: clang++
          - os: ubuntu-24.04
            cxx: clang++
          - os: ubuntu-24.04
            cxx: g++
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: native
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: night-outlook/hybridclr_demo
          ref: d49b85bfd633f25b9f8351e03efd406c6f1df53b
          path: demo
          persist-credentials: false
          sparse-checkout: |
            Tools/AssemblyShadow/R03IR/bounded_v2
            Docs/AssemblyShadow/History/M07R/R03/IR_Remediation/N_SNAPSHOT_PUBLICATION_91b7/checks
            Docs/AssemblyShadow/History/M07R/R03/IR_Remediation/SNAP01_BOUNDED_DESIGN_f8a2/reference
      - name: Typed R02 source and complete owned execution record
        shell: bash
        run: |
          set -euo pipefail
          python3 -B "$GITHUB_WORKSPACE/native/tools/r03/diagnostic_stream/run_frozen_execution.py" \
            --native "$GITHUB_WORKSPACE/native" \
            --output "$RUNNER_TEMP/owned-execution-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Unchanged original and current producer regressions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 -B "$GITHUB_WORKSPACE/native/tools/r03/diagnostic_stream/run_tests.py" \
            --native "$GITHUB_WORKSPACE/native" --demo "$GITHUB_WORKSPACE/demo" \
            --output "$RUNNER_TEMP/legacy-execution-${{ github.run_id }}-${{ github.run_attempt }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: owned-execution-${{ matrix.os }}-${{ matrix.cxx }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/owned-execution-${{ github.run_id }}-${{ github.run_attempt }}
            ${{ runner.temp }}/legacy-execution-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
